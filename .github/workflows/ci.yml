name: Go SDK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            go: '1.26.x'
          - os: windows-latest
            go: '1.26.x'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        run: |
          unformatted="$(gofmt -l january examples/go/main.go examples/local-http/main.go examples/quickstart)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Offline tests and race detector (including README quickstart)
        run: go test -race ./...
      - name: Build module
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Token server example tests
        working-directory: examples/go
        run: go test -race -v .
      - name: Build token server example
        working-directory: examples/go
        run: go build -o "$RUNNER_TEMP/january-legacy-example" .
      - name: Install and run local HTTP consumer
        working-directory: examples/local-http
        run: |
          go run .
